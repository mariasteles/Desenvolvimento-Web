<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bandeira da Estônia</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .flag {
      width: 600px;
      height: 360px;
      border: 2px solid #000;
    }

    .stripe {
      height: 33.33%;
      width: 100%;
    }

    .blue {
      background-color: #0072ce;
    }

    .black {
      background-color: #000000;
    }

    .white {
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="flag">
    <div class="stripe blue"></div>
    <div class="stripe black"></div>
    <div class="stripe white"></div>
  </div>
</body>
</html>
