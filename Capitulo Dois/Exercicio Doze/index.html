<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Final - Retângulo e Círculo</title>

  <style>
    body {
      background-color: white;
      margin: 0;
      position: relative;
      height: 100vh;
    }

    /* Retângulo azul */
    .blue-box {
      background-color: blue;
      width: 500px;
      height: 300px;
      position: absolute;
      top: 200px;
      left: 200px;
    }

    /* Círculo vermelho */
    .red-circle {
      background-color: red;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      position: absolute;
      top: 150px;
      left: 250px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle"></div>
  </div>
</body>
</html>
