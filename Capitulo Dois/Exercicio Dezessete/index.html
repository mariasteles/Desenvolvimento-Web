<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsividade</title>
  <style>
    /* LINKS */
    a {
      display: block;
      margin: 10px 0;
      font-size: 1.2em;
      color: darkblue;
      text-decoration: none;
    }

    a:hover {
      color: crimson;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .media {
      background-color: lightblue;
      padding: 15px;
      margin-top: 20px;
    }

    .media p {
      font-size: 1.2em;
    }

    @media (max-width: 768px) {
      .media {
        background-color: lightgreen;
      }

      .media p {
        font-size: 1em;
      }
    }

    @media (max-width: 480px) {
      .media {
        background-color: lightcoral;
      }

      .media p {
        font-size: 0.9em;
      }
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      background-color: #ffefd5;
      padding: 15px;
      margin-top: 20px;
    }

    .flex-item {
      background-color: #ff8c00;
      color: white;
      width: 30%;
      text-align: center;
      padding: 20px;
      margin: 10px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .flex-item {
        width: 80%;
      }
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      background-color: #e0ffff;
      padding: 15px;
      margin-top: 20px;
    }

    .grid-item {
      background-color: teal;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    footer {
      text-align: center;
      background-color: blueviolet;
      color: white;
      padding: 10px;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <h1>Responsiveness Methods</h1>
  <a href="#media">1. Media Queries</a>
  <a href="#flexbox">2. CSS Flexbox</a>
  <a href="#grid">3. CSS Grid</a>

  <section id="media" class="media">
    <h2>Media Queries</h2>
    <p>Redimensione a tela e veja as cores e o tamanho do texto mudarem conforme o tamanho do dispositivo.</p>
  </section>

  <section id="flexbox" class="flex-container">
    <h2 style="width: 100%; text-align: center;">Flexbox Example</h2>
    <div class="flex-item">Item 1</div>
    <div class="flex-item">Item 2</div>
    <div class="flex-item">Item 3</div>
  </section>

  <section id="grid" class="grid-container">
    <h2 style="grid-column: span 3; text-align: center;">Grid Example</h2>
    <div class="grid-item">A</div>
    <div class="grid-item">B</div>
    <div class="grid-item">C</div>
    <div class="grid-item">D</div>
    <div class="grid-item">E</div>
    <div class="grid-item">F</div>
  </section>

  <footer>© 2025 Teste de Responsividade</footer>
</body>
</html>
